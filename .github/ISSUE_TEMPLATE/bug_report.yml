name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: environment
    attributes: {label: Linux distribution and version}
    validations: {required: true}
  - type: input
    id: satdump
    attributes: {label: SatDump version / configuration}
  - type: textarea
    id: problem
    attributes: {label: What happened?}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant sanitized output}
